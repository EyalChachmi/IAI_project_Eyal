name: Deploy to AWS EKSname: Deploy to AWS EKS



on:on:

  push:  push:

    branches:    branches:

      - main      - main

  workflow_dispatch:  workflow_dispatch:



env:env:

  AWS_REGION: eu-north-1  AWS_REGION: eu-north-1

  EKS_CLUSTER_NAME: iai-cluster  EKS_CLUSTER_NAME: iai-cluster

  ECR_BACKEND_REPOSITORY: iai-backend  ECR_BACKEND_REPOSITORY: iai-backend

  ECR_FRONTEND_REPOSITORY: iai-frontend  ECR_FRONTEND_REPOSITORY: iai-frontend



jobs:jobs:

  build-and-deploy:  build-and-deploy:

    name: Build and Deploy to EKS    name: Build and Deploy to EKS

    runs-on: ubuntu-latest    runs-on: ubuntu-latest

        

    steps:    steps:

    - name: Checkout code    - name: Checkout code

      uses: actions/checkout@v3      uses: actions/checkout@v3



    - name: Configure AWS credentials    - name: Configure AWS credentials

      uses: aws-actions/configure-aws-credentials@v2      uses: aws-actions/configure-aws-credentials@v2

      with:      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}        aws-region: ${{ env.AWS_REGION }}



    - name: Login to Amazon ECR    - name: Login to Amazon ECR

      id: login-ecr      id: login-ecr

      uses: aws-actions/amazon-ecr-login@v1      uses: aws-actions/amazon-ecr-login@v1



    - name: Get AWS Account ID    - name: Get AWS Account ID

      id: aws-account      id: aws-account

      run: |      run: |

        echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT        echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT



    - name: Build, tag, and push Backend image to Amazon ECR    - name: Build, tag, and push Backend image to Amazon ECR

      env:      env:

        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        IMAGE_TAG: ${{ github.sha }}        IMAGE_TAG: ${{ github.sha }}

      run: |      run: |

        cd backend        cd backend

        docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG .        docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG .

        docker tag $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest        docker tag $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

        docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG        docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG

        docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest        docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

        echo "backend_image=$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT        echo "backend_image=$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      id: build-backend      id: build-backend



    - name: Build, tag, and push Frontend image to Amazon ECR    - name: Build, tag, and push Frontend image to Amazon ECR

      env:      env:

        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        IMAGE_TAG: ${{ github.sha }}        IMAGE_TAG: ${{ github.sha }}

      run: |      run: |

        cd frontend        cd frontend

        docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG .        docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG .

        docker tag $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest        docker tag $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG

        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

        echo "frontend_image=$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT        echo "frontend_image=$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      id: build-frontend      id: build-frontend



    - name: Update kubeconfig    - name: Update kubeconfig

      run: |      run: |

        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}



    - name: Update Kubernetes manifests    - name: Update Kubernetes manifests

      run: |      run: |

        cd k8s        cd k8s

        sed -i "s|<AWS_ACCOUNT_ID>|${{ steps.aws-account.outputs.account_id }}|g" backend-deployment.yaml frontend-deployment.yaml        sed -i "s|<AWS_ACCOUNT_ID>|${{ steps.aws-account.outputs.account_id }}|g" backend-deployment.yaml frontend-deployment.yaml

        sed -i "s|<AWS_REGION>|${{ env.AWS_REGION }}|g" backend-deployment.yaml frontend-deployment.yaml        sed -i "s|<AWS_REGION>|${{ env.AWS_REGION }}|g" backend-deployment.yaml frontend-deployment.yaml

        sed -i "s|:latest|:${{ github.sha }}|g" backend-deployment.yaml frontend-deployment.yaml        sed -i "s|:latest|:${{ github.sha }}|g" backend-deployment.yaml frontend-deployment.yaml



    - name: Deploy to EKS    - name: Deploy to EKS

      run: |      run: |

        kubectl apply -f k8s/configmap.yaml        kubectl apply -f k8s/configmap.yaml

        kubectl apply -f k8s/backend-deployment.yaml        kubectl apply -f k8s/backend-deployment.yaml

        kubectl apply -f k8s/frontend-deployment.yaml        kubectl apply -f k8s/frontend-deployment.yaml

        kubectl apply -f k8s/ingress.yaml        kubectl apply -f k8s/ingress.yaml



    - name: Wait for deployments to be ready    - name: Wait for deployments to be ready

      run: |      run: |

        kubectl rollout status deployment/iai-backend --timeout=5m        kubectl rollout status deployment/iai-backend --timeout=5m

        kubectl rollout status deployment/iai-frontend --timeout=5m        kubectl rollout status deployment/iai-frontend --timeout=5m



    - name: Get deployment info    - name: Get deployment info

      run: |      run: |

        echo "=== Deployments ==="        echo "=== Deployments ==="

        kubectl get deployments        kubectl get deployments

        echo ""        echo ""

        echo "=== Pods ==="        echo "=== Pods ==="

        kubectl get pods        kubectl get pods

        echo ""        echo ""

        echo "=== Services ==="        echo "=== Services ==="

        kubectl get services        kubectl get services

        echo ""        echo ""

        echo "=== Ingress ==="        echo "=== Ingress ==="

        kubectl get ingress        kubectl get ingress



    - name: Get Application URL    - name: Get Application URL

      id: get-url      id: get-url

      run: |      run: |

        # Wait a bit for LoadBalancer to be assigned        # Wait a bit for LoadBalancer to be assigned

        sleep 30        sleep 30

        FRONTEND_URL=$(kubectl get service iai-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")        FRONTEND_URL=$(kubectl get service iai-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")

        echo "Application URL: http://$FRONTEND_URL"        echo "Application URL: http://$FRONTEND_URL"

        echo "url=http://$FRONTEND_URL" >> $GITHUB_OUTPUT        echo "url=http://$FRONTEND_URL" >> $GITHUB_OUTPUT



    - name: Deployment Summary    - name: Deployment Summary

      run: |      run: |

        echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY        echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY        echo "" >> $GITHUB_STEP_SUMMARY

        echo "**Deployment Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY        echo "**Deployment Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY

        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

        echo "**Backend Image:** ${{ steps.build-backend.outputs.backend_image }}" >> $GITHUB_STEP_SUMMARY        echo "**Backend Image:** ${{ steps.build-backend.outputs.backend_image }}" >> $GITHUB_STEP_SUMMARY

        echo "**Frontend Image:** ${{ steps.build-frontend.outputs.frontend_image }}" >> $GITHUB_STEP_SUMMARY        echo "**Frontend Image:** ${{ steps.build-frontend.outputs.frontend_image }}" >> $GITHUB_STEP_SUMMARY

        echo "**Application URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY        echo "**Application URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY

