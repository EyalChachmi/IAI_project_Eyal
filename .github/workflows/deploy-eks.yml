name: Deploy to AWS EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  EKS_CLUSTER_NAME: iai-cluster
  ECR_BACKEND_REPOSITORY: iai-backend
  ECR_FRONTEND_REPOSITORY: iai-frontend

jobs:
  build-and-deploy:
    name: Build and Deploy to EKS
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Get AWS Account ID
      id: aws-account
      run: |
        echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

    - name: Build, tag, and push Backend image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend
        docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest
        echo "backend_image=$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
      id: build-backend

    - name: Build, tag, and push Frontend image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd frontend
        docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest
        echo "frontend_image=$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
      id: build-frontend

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

    - name: Update Kubernetes manifests
      run: |
        cd k8s
        sed -i "s|<AWS_ACCOUNT_ID>|${{ steps.aws-account.outputs.account_id }}|g" backend-deployment.yaml frontend-deployment.yaml
        sed -i "s|<AWS_REGION>|${{ env.AWS_REGION }}|g" backend-deployment.yaml frontend-deployment.yaml
        sed -i "s|:latest|:${{ github.sha }}|g" backend-deployment.yaml frontend-deployment.yaml

    - name: Deploy to EKS
      run: |
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
        kubectl apply -f k8s/ingress.yaml

    - name: Wait for deployments to be ready
      run: |
        kubectl rollout status deployment/iai-backend --timeout=5m
        kubectl rollout status deployment/iai-frontend --timeout=5m

    - name: Get deployment info
      run: |
        echo "=== Deployments ==="
        kubectl get deployments
        echo ""
        echo "=== Pods ==="
        kubectl get pods
        echo ""
        echo "=== Services ==="
        kubectl get services
        echo ""
        echo "=== Ingress ==="
        kubectl get ingress

    - name: Get Application URL
      id: get-url
      run: |
        # Wait a bit for LoadBalancer to be assigned
        sleep 30
        FRONTEND_URL=$(kubectl get service iai-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
        echo "Application URL: http://$FRONTEND_URL"
        echo "url=http://$FRONTEND_URL" >> $GITHUB_OUTPUT

    - name: Deployment Summary
      run: |
        echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Backend Image:** ${{ steps.build-backend.outputs.backend_image }}" >> $GITHUB_STEP_SUMMARY
        echo "**Frontend Image:** ${{ steps.build-frontend.outputs.frontend_image }}" >> $GITHUB_STEP_SUMMARY
        echo "**Application URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY

